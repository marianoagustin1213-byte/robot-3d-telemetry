<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Brazo Robótico 5-Ejes 3D</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Panel Flotante de Control y Telemetría */
    .dashboard {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      width: 340px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      background: #ef4444;
      color: white;
    }

    .status-badge.connected {
      background: #10b981;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-weight: 600;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.6);
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 2px;
    }

    .instructions-card {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>

  <!-- CDNs Necesarios para Three.js y Controles de Cámara -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Dashboard de Interfaz -->
  <div class="dashboard">
    <div class="title">
      <span>Brazo 5-Ejes Telemetry</span>
      <span id="status" class="status-badge">Desconectado</span>
    </div>
    
    <button id="connectBtn">Conectar Arduino / Serie</button>

    <div class="telemetry-grid">
      <div class="metric-card">
        <div class="metric-label">Servo 1 (Base)</div>
        <div class="metric-value" id="val-s0">0.0°</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Servo 2 (Hombro)</div>
        <div class="metric-value" id="val-s1">0.0°</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Servo 3 (Codo)</div>
        <div class="metric-value" id="val-s2">0.0°</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Servo 4 (Muñeca)</div>
        <div class="metric-value" id="val-s3">0.0°</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Servo 5 (Pinza)</div>
        <div class="metric-value" id="val-s4">0.0°</div>
      </div>
    </div>
  </div>

  <div class="instructions-card">
    🖱️ Clic + Arrastrar: Girar Cámara | Scroll: Zoom
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- 1. CONFIGURACIÓN DE LA ESCENA 3D ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Controles interactivos con el ratón
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Rejilla de fondo
    const grid = new THREE.GridHelper(20, 20, 0x38bdf8, 0x334155);
    grid.position.y = 0;
    scene.add(grid);

    // --- 2. CONSTRUCCIÓN DEL BRAZO ROBÓTICO DE 5 ARTICULACIONES ---
    const matBase = new THREE.MeshPhongMaterial({ color: 0x444466 });
    const matJoint = new THREE.MeshPhongMaterial({ color: 0x00d2ff });
    const matArm = new THREE.MeshPhongMaterial({ color: 0xff4757 });

    // Servo 1: Base Giratoria (Eje Y)
    const baseGroup = new THREE.Group();
    const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.5, 0.8, 16), matBase);
    baseMesh.position.y = 0.4;
    baseGroup.add(baseMesh);
    scene.add(baseGroup);

    // Servo 2: Hombro (Eje Z)
    const joint2 = new THREE.Group();
    joint2.position.y = 0.8;
    baseGroup.add(joint2);
    const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), matArm);
    arm1.position.y = 1.5;
    joint2.add(arm1);

    // Servo 3: Codo (Eje Z)
    const joint3 = new THREE.Group();
    joint3.position.y = 3;
    joint2.add(joint3);
    const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.5, 0.5), matJoint);
    arm2.position.y = 1.25;
    joint3.add(arm2);

    // Servo 4: Muñeca (Eje Z)
    const joint4 = new THREE.Group();
    joint4.position.y = 2.5;
    joint3.add(joint4);
    const arm3 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.5, 0.4), matArm);
    arm3.position.y = 0.75;
    joint4.add(arm3);

    // Servo 5: Pinza (Eje X)
    const joint5 = new THREE.Group();
    joint5.position.y = 1.5;
    joint4.add(joint5);
    const gripper = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.3), matJoint);
    gripper.position.y = 0.2;
    joint5.add(gripper);

    // --- 3. LÓGICA DE ACTUALIZACIÓN Y SUAVIZADO (LERP) ---
    let targetAngles = [0, 0, 0, 0, 0];
    let currentAngles = [0, 0, 0, 0, 0];

    function animate() {
      requestAnimationFrame(animate);

      // Suavizar movimiento de cada articulación con Lerp
      for (let i = 0; i < 5; i++) {
        currentAngles[i] += (targetAngles[i] - currentAngles[i]) * 0.2;
      }

      // Aplicar rotaciones al modelo 3D del brazo
      baseGroup.rotation.y = THREE.MathUtils.degToRad(currentAngles[0]);
      joint2.rotation.z = THREE.MathUtils.degToRad(currentAngles[1] - 90); // Centrado de hombro
      joint3.rotation.z = THREE.MathUtils.degToRad(currentAngles[2]);
      joint4.rotation.z = THREE.MathUtils.degToRad(currentAngles[3]);
      joint5.rotation.x = THREE.MathUtils.degToRad(currentAngles[4]);

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- 4. COMUNICACIÓN WEB SERIAL API ---
    const connectBtn = document.getElementById('connectBtn');
    const statusBadge = document.getElementById('status');

    connectBtn.addEventListener('click', async () => {
      if ('serial' in navigator) {
        try {
          const port = await navigator.serial.requestPort();
          await port.open({ baudRate: 115200 });

          statusBadge.innerText = "Conectado";
          statusBadge.classList.add("connected");
          connectBtn.innerText = "Desconectar / Cambiar Puerto";

          const textDecoder = new TextDecoderStream();
          const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
          const reader = textDecoder.readable.getReader();

          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += value;
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              parseTelemetry(line.trim());
            }
          }
        } catch (err) {
          console.error("Error al conectar:", err);
          alert("No se pudo conectar al puerto serie. Asegúrate de cerrar el Monitor Serie del Arduino IDE.");
        }
      } else {
        alert("Tu navegador no soporta Web Serial API. Utiliza Google Chrome o Microsoft Edge.");
      }
    });

    // Procesar datos CSV de 5 servos (ej: 90.0,45.0,120.0,10.0,90.0)
    function parseTelemetry(data) {
      const parts = data.split(',');
      if (parts.length >= 5) {
        const angles = parts.slice(0, 5).map(val => parseFloat(val));

        if (angles.every(val => !isNaN(val))) {
          targetAngles = angles;

          // Actualizar dashboard visual
          for (let i = 0; i < 5; i++) {
            document.getElementById(`val-s${i}`).innerText = angles[i].toFixed(1) + '°';
          }
        }
      }
    }

    // Redimensionamiento responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
